<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      body {
        font: 14px system-ui, sans-serif;
        color: var(--text-color, #30343b);
        margin: 0
      }

      button {
        font: inherit;
        border: 1px solid #aaa6;
        border-radius: 7px;
        padding: 5px 9px;
        background: transparent;
        cursor: pointer
      }

      .item {
        padding: 10px 0;
        border-bottom: 1px solid #8883
      }

      .meta {
        font-size: 12px;
        opacity: .75;
        margin: 5px 0
      }

      .actions {
        display: flex;
        gap: 7px;
        flex-wrap: wrap
      }

      .muted {
        opacity: .7;
        font-size: 12px
      }

      .error {
        color: #ad2424
      }
    </style>
  </head>
  <body>
    <div id="root">Initializing local archive…</div>
    <script>
      const root = document.getElementById('root');
      let db, lastId = '',
        lastSent = '';

      function send(type, data) {
        window.parent.postMessage({
          isStreamlitMessage: true,
          type,
          ...data
        }, '*')
      }

      function height() {
        send('streamlit:setFrameHeight', {
          height: Math.max(80, document.documentElement.scrollHeight + 8)
        })
      }

      function openDB() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open('cutplanner-local-vault', 1);
          req.onupgradeneeded = () => {
            let d = req.result;
            if (!d.objectStoreNames.contains('results')) d.createObjectStore('results', {
              keyPath: 'id'
            })
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error)
        })
      }

      function tx(mode, fn) {
        return new Promise((resolve, reject) => {
          const t = db.transaction('results', mode),
            s = t.objectStore('results');
          let request = fn(s);
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error)
        })
      }

      function esc(s) {
        return String(s ?? '').replace(/[&<>"']/g, c => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        } [c]))
      }

      function download(b64, mime, filename) {
        let raw = atob(b64),
          buf = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; i++) buf[i] = raw.charCodeAt(i);
        let u = URL.createObjectURL(new Blob([buf], {
          type: mime
        }));
        let a = document.createElement('a');
        a.href = u;
        a.download = filename;
        a.click();
        setTimeout(() => URL.revokeObjectURL(u), 2000)
      }
      async function render() {
        if (!db) return;
        let records = (await tx('readonly', s => s.getAll())).sort((a, b) => b.created.localeCompare(a.created));
        let html = '<strong>Local results archive</strong><div class="muted">Stored in this browser (IndexedDB). Ready-made reports can be downloaded again.</div>';
        if (!records.length) html += '<p class="muted">No saved calculations yet.</p>';
        for (let r of records.slice(0, 30)) {
          html += `<div class="item"><strong>${esc(r.name)}</strong><div class="meta">${r.synced?'☁ Synced':'⏳ Queued for cloud'} · ${esc(r.created)} · ${esc(r.sheets)} sheets · ${esc(r.patterns)} patterns · ${esc(r.waste)}% waste</div><div class="actions"><button data-id="${esc(r.id)}" data-kind="pdf">PDF</button><button data-id="${esc(r.id)}" data-kind="xlsx">Excel</button><button data-id="${esc(r.id)}" data-kind="delete">Delete local copy</button></div></div>`
        }
        root.innerHTML = html;
        root.querySelectorAll('button').forEach(btn => btn.onclick = async () => {
          let r = await tx('readonly', s => s.get(btn.dataset.id));
          if (!r) return;
          if (btn.dataset.kind === 'delete') {
            await tx('readwrite', s => s.delete(r.id));
            render();
            return
          }
          let pdf = btn.dataset.kind === 'pdf';
          download(pdf ? r.pdf : r.xlsx, pdf ? 'application/pdf' : 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', (r.name || 'cutplanner') + (pdf ? '.pdf' : '.xlsx'))
        });
        height()
      }
      window.addEventListener('message', async e => {
        if (e.data?.type !== 'streamlit:render') return;
        try {
          if (!db) db = await openDB();
          const args = e.data.args || {},
            rec = args.result;
          if (rec && rec.id !== lastId) {
            let old = await tx('readonly', s => s.get(rec.id));
            await tx('readwrite', s => s.put({
              ...rec,
              synced: !!args.synced || !!old?.synced
            }));
            lastId = rec.id
          }
          if (args.ack) {
            let ackRec = await tx('readonly', s => s.get(args.ack));
            if (ackRec && !ackRec.synced) {
              await tx('readwrite', s => s.put({
                ...ackRec,
                synced: true
              }))
            }
            lastSent = ''
          }
          await render();
          let pending = (await tx('readonly', s => s.getAll())).filter(r => !r.synced).sort((a, b) => a.created.localeCompare(b.created));
          if (pending.length && pending[0].id !== lastSent) {
            lastSent = pending[0].id;
            send('streamlit:setComponentValue', {
              value: {
                pending: pending[0]
              }
            })
          }
        } catch (err) {
          root.innerHTML = '<p class="error">Browser storage unavailable: ' + esc(err.message) + '</p>';
          height()
        }
      });
      send('streamlit:componentReady', {
        apiVersion: 1
      });
      height();
    </script>
  </body>
</html>
